name: Update feeds and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      hop:
        description: Self-refresh counter (leave at 0)
        required: false
        default: '0'
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull live feeds
        run: SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" node scripts/fetch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying a failed deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Retry deploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # GitHub runs scheduled jobs about once an hour at best, so each scheduled run
  # re-triggers itself every ~10 minutes, five times, to keep the feeds fresh.
  again:
    needs: deploy
    if: ${{ always() && github.event_name != 'push' && fromJSON(github.event.inputs.hop || '0') < 5 }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then run again
        run: |
          sleep 540
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main -f hop=$(( HOP + 1 ))
        env:
          GH_TOKEN: ${{ github.token }}
          HOP: ${{ github.event.inputs.hop || '0' }}
